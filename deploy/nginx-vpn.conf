# VPN 管控平台 —— Nginx HTTPS 反代（放到 /etc/nginx/conf.d/vpn-web.conf）
# 前置：证书已就绪（如 /etc/ssl/vpn/ 下）；平台 COOKIE_SECURE=1；平台监听 127.0.0.1:8787
# 平台已 app.set('trust proxy', 1) 并读 X-Forwarded-For，故审计 IP 会正确记录真实客户端。

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name vpn.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpn.example.com;

    ssl_certificate     /etc/ssl/vpn/fullchain.pem;
    ssl_certificate_key /etc/ssl/vpn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 头像上传体积上限
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
