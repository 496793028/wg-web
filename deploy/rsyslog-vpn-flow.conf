# /etc/rsyslog.d/40-vpn-flow.conf
# 把网关 nftables 记账日志（前缀 vpn-flow）单独落到 /var/log/vpn-flow.log，
# 供 vpn-logship 采集回传平台。
#
# 说明：nftables 的 `log prefix "vpn-flow ..."` 会写内核日志，
# rsyslog 收到后按 msg 内容筛选即可。
# 不 stop、不影响其它日志继续进 /var/log/messages（便于排障）。

:msg, contains, "vpn-flow" /var/log/vpn-flow.log
# 如需避免重复/降噪，取消下一行注释即可让匹配行只进专用文件：
# & stop
